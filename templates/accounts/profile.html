{% extends 'base.html' %}
{% block title %}User Profile{% endblock %}
{% block content %}
    <h2>User Profile</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" class="form-control" id="phone" value="{{ profile.phone|default_if_none:'' }}" disabled>
        </div>
        <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" value="{{ profile.email|default_if_none:'' }}" disabled>
        </div>
        <div class="form-group">
            <label for="store" class="form-label">Select Store</label>
            <select class="form-control" id="store" name="store" required>
                <option value="">Select a store</option>
                {% for store in stores %}
                    <option value="{{ store.id }}" {% if store.id|stringformat:"s" == selected_store %}selected{% endif %}>
                        {{ store.name }} - {{ store.city }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <input type="hidden" id="latitude" name="latitude" value="{{ profile.latitude|default_if_none:'' }}">
        <input type="hidden" id="longitude" name="longitude" value="{{ profile.longitude|default_if_none:'' }}">
        <button type="submit" class="btn">Update Profile</button>
    </form>
    <script>
        $(document).ready(function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    $('#latitude').val(position.coords.latitude);
                    $('#longitude').val(position.coords.longitude);
                });
            }
        });
    </script>
{% endblock %}
